<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Survey Matcher</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb}
    .app{display:grid;grid-template-columns:320px 1fr;height:100vh}.side{padding:18px;background:#111827;border-left:1px solid #263244;overflow:auto}
    h1{font-size:22px;margin:0 0 5px}.muted{color:#94a3b8;font-size:13px}.group{margin-top:20px;padding-top:15px;border-top:1px solid #263244}
    label{display:block;font-size:13px;margin:10px 0 6px;color:#cbd5e1}.file{width:100%;padding:10px;border:1px dashed #475569;border-radius:8px;background:#0b1220;color:#cbd5e1}
    button{width:100%;padding:10px;margin-top:9px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer;font-weight:bold}
    button.secondary{background:#334155}button.warn{background:#b45309}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    input[type=number],input[type=text]{width:100%;padding:9px;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:7px}
    .main{display:flex;flex-direction:column;min-width:0}.toolbar{padding:12px 16px;background:#111827;border-bottom:1px solid #263244;display:flex;gap:8px;align-items:center}
    .toolbar button{width:auto;margin:0}.status{margin-right:auto;color:#94a3b8;font-size:13px}.canvasWrap{position:relative;flex:1;overflow:hidden;background:#0b1020}
    canvas{width:100%;height:100%;display:block}.legend{position:absolute;left:15px;top:15px;background:#111827dd;padding:10px;border-radius:8px;font-size:12px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f59e0b;margin-left:5px}.line{display:inline-block;width:15px;height:2px;background:#94a3b8;margin-left:5px}
    .report{font-size:12px;line-height:1.7;color:#cbd5e1}.report b{color:white}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;max-height:45vh}.main{height:55vh}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>Survey Matcher</h1>
    <div class="muted">SDR + DXF / DWG • MVP</div>

    <div class="group">
      <label>ملف الرفع المساحي SDR</label>
      <input id="sdr" class="file" type="file" accept=".sdr,.txt,.csv" />
      <div id="sdrInfo" class="muted"></div>
    </div>

    <div class="group">
      <label>ملف اللوحة DXF</label>
      <input id="dxf" class="file" type="file" accept=".dxf" />
      <div id="dxfInfo" class="muted"></div>
      <label>ملف DWG (للمرحلة التالية)</label>
      <input id="dwg" class="file" type="file" accept=".dwg" />
      <div id="dwgInfo" class="muted"></div>
    </div>

    <div class="group">
      <label>بحث عن نقطة</label>
      <input id="search" type="text" placeholder="مثال: 105" />
      <button id="searchBtn">تحديد النقطة</button>
    </div>

    <div class="group">
      <label>حجم النقطة</label>
      <input id="pointSize" type="number" value="5" min="1" max="20" />
      <label>حد اختلاف المطابقة (متر)</label>
      <input id="tol" type="number" value="0.05" min="0" step="0.001" />
      <div class="row">
        <button id="fit" class="secondary">Fit</button>
        <button id="reset" class="secondary">Reset</button>
      </div>
    </div>

    <div class="group">
      <button id="export" class="warn">تصدير DXF</button>
      <div class="report" id="report">ارفع SDR وDXF لبدء المطابقة.</div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <button id="surveyToggle" class="secondary">إخفاء الرفع</button>
      <button id="drawingToggle" class="secondary">إخفاء اللوحة</button>
      <button id="zoomIn" class="secondary">+</button>
      <button id="zoomOut" class="secondary">−</button>
      <span class="status" id="status">جاهز</span>
    </div>
    <div class="canvasWrap">
      <canvas id="view"></canvas>
      <div class="legend">
        <div><span class="line"></span> DXF</div>
        <div><span class="dot"></span> Survey Points</div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
